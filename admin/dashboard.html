<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Papa Fils na Mama Fils Shop</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="admin-shell">
  <aside class="admin-sidebar" id="admin-mobile-menu">
    <div class="admin-brand">
      <span class="brand-mark">PF</span>
      <span>Admin Panel</span>
    </div>
    <nav class="admin-nav">
      <a href="#" data-view="dashboard" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="#" data-view="products"><i class="fa-solid fa-box"></i> Products</a>
      <a href="#" data-view="bookings"><i class="fa-regular fa-calendar-check"></i> Bookings</a>
      <a href="#" data-view="orders"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
      <a href="#" data-view="reviews"><i class="fa-solid fa-star"></i> Reviews</a>
      <a href="#" data-view="portfolio"><i class="fa-solid fa-briefcase"></i> Portfolio</a>
      <a href="#" data-view="messages"><i class="fa-regular fa-envelope"></i> Messages</a>
      <div class="divider"></div>
      <a href="#" data-view="statistics"><i class="fa-solid fa-chart-simple"></i> Statistics</a>
      <a href="#" data-view="settings"><i class="fa-solid fa-gear"></i> Settings</a>
      <div class="divider"></div>
      <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
    </nav>
    <button class="btn btn-outline btn-block admin-logout" id="admin-logout" style="border-color:rgba(255,255,255,.3);color:#fff;">
      <i class="fa-solid fa-right-from-bracket"></i> Log Out
    </button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 id="admin-page-title">Dashboard</h1>
        <div class="subtitle">Manage your shop — everything saves instantly to this browser.</div>
      </div>
      <button class="icon-btn" id="admin-mobile-toggle" style="display:none;"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="admin-view active" id="view-dashboard"></div>
    <div class="admin-view" id="view-products"></div>
    <div class="admin-view" id="view-bookings"></div>
    <div class="admin-view" id="view-orders"></div>
    <div class="admin-view" id="view-reviews"></div>
    <div class="admin-view" id="view-portfolio"></div>
    <div class="admin-view" id="view-messages"></div>
    <div class="admin-view" id="view-statistics"></div>
    <div class="admin-view" id="view-settings"></div>
  </main>
</div>

<script src="../js/modules/seed-data.js"></script>
<script src="../js/modules/utils.js"></script>
<script src="../js/modules/storage.js"></script>
<script src="../js/modules/store.js"></script>
<script src="../js/modules/ui.js"></script>
<script src="auth.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
