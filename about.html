<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us — Papa Fils na Mama Fils Shop</title>
<meta name="description" content="Learn the story of Papa Fils na Mama Fils Shop — a family-run business at Byumba Market serving Rwanda since 2014.">
<link rel="canonical" href="https://papafilsnamamafils.rw/about.html">
<meta property="og:type" content="website">
<meta property="og:title" content="About Papa Fils na Mama Fils Shop">
<meta property="og:description" content="A family-run shop at Byumba Market serving Rwanda since 2014.">
<meta property="og:image" content="assets/images/coats-dresses-rack.jpeg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">

<div id="loading-screen"><div class="mark">PF</div></div>
<header class="site-header" id="site-header"></header>

<main>
  <section class="breadcrumb-hero">
    <div class="container">
      <span class="eyebrow">About Us</span>
      <h1>Two generations, one shop, one promise.</h1>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container hero-grid" style="align-items:flex-start;">
      <div>
        <span class="eyebrow">Our Story</span>
        <h2>Started with one stall in 2014</h2>
        <p id="about-story" style="font-size:16.5px;"></p>
        <div class="hero-trust" style="margin-top:24px;">
          <div><i class="fa-solid fa-circle-check"></i> Family-owned &amp; operated</div>
          <div><i class="fa-solid fa-circle-check"></i> Byumba Market, since 2014</div>
        </div>
      </div>
      <div class="hero-media-frame" style="aspect-ratio:1/1;">
        <img src="assets/images/coats-dresses-rack.jpeg" alt="Fashion rack inside the shop" loading="lazy">
      </div>
    </div>
  </section>

  <section class="section section--dim">
    <div class="container grid grid-2">
      <div class="card" style="padding:36px;">
        <i class="fa-solid fa-bullseye" style="font-size:26px;color:var(--indigo);margin-bottom:16px;"></i>
        <h3>Our Mission</h3>
        <p id="about-mission"></p>
      </div>
      <div class="card" style="padding:36px;">
        <i class="fa-solid fa-eye" style="font-size:26px;color:var(--terracotta);margin-bottom:16px;"></i>
        <h3>Our Vision</h3>
        <p id="about-vision"></p>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow">What we stand for</span>
        <h2>Core Values</h2>
      </div>
      <div class="grid grid-4" id="values-grid"></div>
    </div>
  </section>

  <section class="section section--dim">
    <div class="container">
      <div class="section-head center">
        <span class="eyebrow">Find Us</span>
        <h2>Visit Byumba Market</h2>
      </div>
      <div class="grid grid-2">
        <div class="info-list">
          <div class="info-item"><i class="fa-solid fa-location-dot"></i><div><strong>Address</strong><span id="about-address"></span></div></div>
          <div class="info-item"><i class="fa-solid fa-phone"></i><div><strong>Phone</strong><span id="about-phone"></span></div></div>
          <div class="info-item"><i class="fa-regular fa-envelope"></i><div><strong>Email</strong><span id="about-email"></span></div></div>
          <div class="info-item"><i class="fa-regular fa-clock"></i><div><strong>Opening Hours</strong><span id="about-hours"></span></div></div>
        </div>
        <div class="map-frame">
          <iframe title="Map to Byumba Market" loading="lazy" src="https://www.google.com/maps?q=Byumba+Market+Rwanda&output=embed"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a class="whatsapp-fab" id="whatsapp-fab" href="#" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
<button id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<script src="js/modules/seed-data.js"></script>
<script src="js/modules/utils.js"></script>
<script src="js/modules/storage.js"></script>
<script src="js/modules/store.js"></script>
<script src="js/modules/ui.js"></script>
<script src="js/modules/render.js"></script>
<script>
  UI.init("about");
  const biz = DataStore.getBusiness();
  document.getElementById("about-story").textContent = biz.story;
  document.getElementById("about-mission").textContent = biz.mission;
  document.getElementById("about-vision").textContent = biz.vision;
  document.getElementById("about-address").textContent = biz.address;
  document.getElementById("about-phone").textContent = biz.phone;
  document.getElementById("about-email").textContent = biz.email;
  document.getElementById("about-hours").innerHTML = biz.hours.map(h => `${h.days}: ${h.time}`).join("<br>");
  document.getElementById("values-grid").innerHTML = biz.values.map((v, i) => `
    <div class="card value-card"><span class="num">0${i+1}</span><h3 style="font-size:17px;">${v.title}</h3><p>${v.text}</p></div>
  `).join("");
  document.getElementById("whatsapp-fab").href = Utils.waLink(biz.whatsapp, "Hello! I'd like to know more about your shop.");
</script>
</body>
</html>
