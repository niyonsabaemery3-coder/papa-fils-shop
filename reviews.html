<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Reviews — Papa Fils na Mama Fils Shop</title>
<meta name="description" content="Read what customers say about Papa Fils na Mama Fils Shop, and leave your own review.">
<link rel="canonical" href="https://papafilsnamamafils.rw/reviews.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Customer Reviews — Papa Fils na Mama Fils Shop">
<meta property="og:description" content="Read what customers say, and leave your own review.">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reviews">

<div id="loading-screen"><div class="mark">PF</div></div>
<header class="site-header" id="site-header"></header>

<main>
  <section class="breadcrumb-hero">
    <div class="container">
      <span class="eyebrow">Customer Reviews</span>
      <h1>What Byumba says about us</h1>
      <div style="display:flex;gap:16px;justify-content:center;align-items:center;margin-top:18px;">
        <span style="font-family:var(--font-display);font-size:34px;color:var(--indigo);" id="avg-rating-display">—</span>
        <span style="color:var(--ink-soft);font-size:14px;" id="review-count-display"></span>
      </div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container hero-grid" style="align-items:flex-start;">
      <div>
        <div class="section-head">
          <span class="eyebrow">All Reviews</span>
          <h2>Recent feedback</h2>
        </div>
        <div class="grid grid-1" id="reviews-list" style="display:flex;flex-direction:column;gap:20px;"></div>
      </div>

      <div class="form-card">
        <h3 style="margin-bottom:6px;">Leave a review</h3>
        <p style="margin-bottom:20px;">You can edit or delete your review any time from this device.</p>
        <form id="review-form" novalidate>
          <div class="field">
            <label>Your Rating <span class="req">*</span></label>
            <div class="star-input" id="star-input" role="radiogroup" aria-label="Star rating"></div>
          </div>
          <div class="field">
            <label>Your Name <span class="req">*</span></label>
            <input type="text" name="reviewerName" required>
            <span class="error">Please enter your name.</span>
          </div>
          <div class="field">
            <label>Your Review <span class="req">*</span></label>
            <textarea name="reviewerComment" required placeholder="Tell us about your experience…"></textarea>
            <span class="error">Please write at least a few words.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-paper-plane"></i> Submit Review</button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a class="whatsapp-fab" id="whatsapp-fab" href="#" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
<button id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<script src="js/modules/seed-data.js"></script>
<script src="js/modules/utils.js"></script>
<script src="js/modules/storage.js"></script>
<script src="js/modules/store.js"></script>
<script src="js/modules/ui.js"></script>
<script src="js/modules/render.js"></script>
<script src="js/reviews.js"></script>
<script>
  UI.init("reviews");
  const biz = DataStore.getBusiness();
  document.getElementById("whatsapp-fab").href = Utils.waLink(biz.whatsapp, "Hello!");
</script>
</body>
</html>
