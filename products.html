<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products — Papa Fils na Mama Fils Shop</title>
<meta name="description" content="Browse fashion, bedding, curtains and luggage at Papa Fils na Mama Fils Shop, Byumba Market. Search, filter by category, sort by price, and order online.">
<link rel="canonical" href="https://papafilsnamamafils.rw/products.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Products — Papa Fils na Mama Fils Shop">
<meta property="og:description" content="Fashion, bedding, curtains and luggage — browse and order online.">
<meta property="og:image" content="assets/images/bedsheets-shelf-1.jpeg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">

<div id="loading-screen"><div class="mark">PF</div></div>
<header class="site-header" id="site-header"></header>

<main>
  <section class="breadcrumb-hero">
    <div class="container">
      <span class="eyebrow">Our Catalogue</span>
      <h1>Find your next favourite thing</h1>
      <p style="max-width:520px;margin:14px auto 0;">Search, filter by department, and sort by price. Add anything to your order — no payment needed until you collect.</p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="container">
      <div class="cat-pill-row" id="category-pills" style="margin-bottom:24px;"></div>

      <div class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" id="product-search" placeholder="Search products…" aria-label="Search products">
        </div>
        <select id="product-sort" class="select-inline" aria-label="Sort products">
          <option value="default">Sort: Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="name-asc">Name: A–Z</option>
        </select>
        <a href="order.html" class="btn btn-dark btn-sm"><i class="fa-solid fa-cart-shopping"></i> My Order (<span id="cart-count-badge">0</span>)</a>
      </div>

      <p id="result-count" style="font-size:13.5px;color:var(--ink-soft);margin-bottom:18px;"></p>

      <div class="grid grid-4" id="products-grid"></div>
      <div class="empty-state" id="products-empty" style="display:none;">
        <i class="fa-regular fa-face-frown"></i>
        <p>No products match your search. Try a different keyword or category.</p>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>
<a class="whatsapp-fab" id="whatsapp-fab" href="#" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
<button id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

<script src="js/modules/seed-data.js"></script>
<script src="js/modules/utils.js"></script>
<script src="js/modules/storage.js"></script>
<script src="js/modules/store.js"></script>
<script src="js/modules/ui.js"></script>
<script src="js/modules/render.js"></script>
<script src="js/products.js"></script>
<script>
  UI.init("products");
  const biz = DataStore.getBusiness();
  document.getElementById("whatsapp-fab").href = Utils.waLink(biz.whatsapp, "Hello! I have a question about a product.");
</script>
</body>
</html>
